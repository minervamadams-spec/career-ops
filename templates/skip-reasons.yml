# templates/skip-reasons.yml — SINGLE SOURCE OF TRUTH for the structured
# self-filter reason taxonomy captured when a tracker row is set to SKIP.
#
# Read live by both the CLI (set-status.mjs) and the web app
# (web/src/lib/core/skip-reasons.ts), mirroring templates/states.yml's own
# pattern so the two writers can never drift. Mined from 130 hand-typed
# "Passed: <reason>" notes across data/applications.md (career-ops offerly
# scoring brief, 2026-09-22) — these 11 categories covered all but a handful
# of single-occurrence outliers, which fall to skill_or_background_mismatch.
#
# `id` is what gets written into the Notes cell as a `reason={id}` prefix
# (see AGENTS.md's `track=`/`applying=yes` Notes-prefix convention — same
# mechanism, no tracker schema migration). `label` is the human-facing text.
reasons:
  - id: not_my_domain
    label: "Not my domain"
  - id: location_or_remote_restricted
    label: "Location/remote restricted"
  - id: expired_listing
    label: "Expired listing"
  - id: unwanted_part_time_or_fractional
    label: "Unwanted part-time/fractional"
  - id: duplicate_of_existing
    label: "Duplicate of existing application"
  - id: not_qualified
    label: "Not qualified"
  - id: travel_required
    label: "Travel required"
  - id: comp_too_low
    label: "Comp too low"
  - id: wrong_seniority
    label: "Wrong seniority"
  - id: undesired_shift_or_schedule
    label: "Undesired shift/schedule"
  - id: skill_or_background_mismatch
    label: "Skill/background mismatch"
